<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Exercise 04 - Fetch</title>
    <link rel="stylesheet", href="04-fetch.css" />
    <!-- Use defer to not execute javascript until all elements exist-->
    <script defer src="04-fetch.js"></script>
  </head>
  <body>
    <main>
      <header class="header">
        <h1 class="brand-logo">Pokedex</h1>
        <div class="search-container">
          <input type="text" id="navbar-search" class="navbar-search"
          placeholder="Search Pokemon..." aria-label="Search bar input for finding pokemon by type or name partial match"/>
        </div>
      </header>
      <section class="container">
        <div class="loading-container">
          <img src="../images/loader.gif" alt="loader gif while the data loads" width="60" height="60"/>
          <p class="loading">Loading...</p>
        </div>
        <div class="poke-list"></div>
      </section>
    </main>
  </body>
</html>
