<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Exercise 02 - Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body class="bg-light">
    <!-- For the 05 exercises, to create a form that formats differently
     depending on screen width, we will use a grid-based form with
     column elements that expand when the screen gets larger.
     
     The instructor graciously already made form have max width of 400 px in 
     the CSS (thanks!), so we don't need to do anything else for sizing.-->
     <div class="d-flex justify-content-center align-items-center vh-100">
     <form class="form border p-4 rounded shadow-sm">
      <!-- Title of the form: always full width -->
      <div class="row mb-3">
        <div class="col">
          <h1 class="text-center m-4 fs-2">Roth IRA Calculator</h1>
        </div>
      </div>

      <div class="row mb-3">
        <label for="inputBalance" class="col-sm-6 col-form-label">
        Balance ($)
        </label>
        <div class="col-sm-6">
        <input type="number" class="form-control" min="0" name="balance" id="inputBalance" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="annualContribution" class="col-sm-6 col-form-label">
        Annual Contribution ($)
        </label>
        <div class="col-sm-6">
        <input type="number" class="form-control" min="0" name="annualContribution" id="annualContribution" required>
        </div>
      </div>

      <fieldset class="row mb-3">
          <legend class="col-sm-6 col-form-label pt-0">Maximize Contributions?</legend>
          <div class="col-sm-6">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="maxRadios" id="maxRadioYes" value="Yes" checked>
              <label class="form-check-label" for="maxRadioYes">
                Yes
              </label>
            </div>          
            <div class="form-check">
              <input class="form-check-input" type="radio" name="maxRadios" id="maxRadioNo" value="No">
              <label class="form-check-label" for="maxRadioNo">
                No
              </label>
            </div>
          </div>
        </fieldset>

      <div class="row mb-3">
        <label for="expectedReturn" class="col-sm-6 col-form-label">
          Expected Return (%)
        </label>
        <div class="col-sm-6">
          <input type="number" class="form-control" min="0" id="expectedReturn">
        </div>
      </div>

      <div class="row mb-3">
        <label for="currentAge" class="col-sm-6 col-form-label">
          Current Age
        </label>
        <div class="col-sm-6">
          <input type="number" class="form-control" min="0" id="currentAge">
        </div>
      </div>

      <div class="row mb-3">
        <label for="retirementAge" class="col-sm-6 col-form-label">
          Retirement Age
        </label>
        <div class="col-sm-6">
          <input type="number" class="form-control" min="0" id="retirementAge">
        </div>
      </div>

      <div class="row mb-3">
        <label for="marginalTaxRate" class="col-sm-6 col-form-label">
          Marginal Tax Rate (%)
        </label>
        <div class="col-sm-6">
          <input type="number" class="form-control" min="0" id="marginalTaxRate">
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-6">
          <button type="submit" class="btn btn-primary w-100">Calculate</button>
        </div>        
        <div class="col-6">
          <button type="reset" class="btn btn-primary-outline w-100">Reset</button>
        </div>
      </div>

      <div class="row mb-3">
        <p class="text-start">This exercise is a simplified version of the ROTH IRA Calculator <a href="https://calculator.net">Calculator.net</a></p>
      </div>

     </form>
    </div>
  </body>
</html>
